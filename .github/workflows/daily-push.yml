name: Daily push reminders

# The Vercel Hobby plan has no usable cron, so GitHub Actions is the scheduler.
#
# GitHub's cron can drift by several minutes under load, so the morning job is
# aimed at 08:40 IST — even a 20-minute delay still lands before the 09:15
# market open, which is the whole point of that reminder.
#
#   03:10 UTC = 08:40 IST  (morning: earn today's license)
#   10:30 UTC = 16:00 IST  (evening: write tonight's mirror)
on:
  schedule:
    - cron: '10 3 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Which reminder to send'
        required: true
        default: morning
        type: choice
        options: [morning, evening]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Decide reminder type
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 3 * * *" ]; then
            echo "type=morning" >> "$GITHUB_OUTPUT"
          else
            echo "type=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Send reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          TYPE="${{ steps.pick.outputs.type }}"
          BASE="${SITE_URL:-https://mindpowervaultt.com}"
          echo "Sending $TYPE reminders via $BASE"
          CODE=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "$BASE/api/cron/push?type=$TYPE" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $CODE"
          cat /tmp/out.json; echo
          # Fail loudly so a silent breakage shows up in the Actions tab.
          test "$CODE" = "200"
